[project]
name = "xhand-teleop"
version = "0.1.0"
description = "XHAND teleoperation via Apple Vision Pro + MuJoCo + EtherCAT"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.5",
    "numpy",
    "scipy",
    "vuer>=0.1.5",
    "params-proto>=3.0",
]

[project.optional-dependencies]
# Minimal deps for the ROS client (teleop_avp_ros.py).
# Install in a separate Python 3.8 venv with --system-site-packages
# so rospy is available from the system ROS Noetic install.
#   uv venv .venv-ros --python /usr/bin/python3 --system-site-packages
#   uv pip install --python .venv-ros/bin/python vuer numpy Pillow
ros = [
    "vuer>=0.1.5",
    "numpy",
    "Pillow",
]

[project.scripts]
xhand-teleop = "xhand_teleop.teleoperate:main"
xhand-teleop-bimanual = "xhand_teleop.teleoperate_bimanual:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["xhand_teleop*", "astribot*"]
